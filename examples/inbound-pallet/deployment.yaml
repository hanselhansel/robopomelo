specVersion: 1.0.0
project:
  id: example-inbound
  name: Inbound pallet transfer (fictional example)
  problem:
    state: provided
    value: Manual transfers from receiving to staging interrupt receiving work and have unclear exception ownership. This is a fictional discovery scenario.
  outcome:
    state: provided
    value: Define a repeatable receiving-to-staging flow and measurable acceptance criteria before selecting detailed engineering or simulation inputs.
  scope:
    state: provided
    value: Pallet movements between a receiving handoff and a staging handoff, including blocked destinations and failed pickups.
  exclusions:
    - Rack handling
    - Robot control
    - Capacity prediction
    - Safety certification
    - Executed acceptance results
  approverId:
    state: provided
    value: stakeholder-operator

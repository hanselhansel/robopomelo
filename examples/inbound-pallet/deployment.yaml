acceptanceTests:
  - id: test-rate
    title: Measure planned transfer-rate criterion
    description: null
    ownerId:
      state: provided
      value: stakeholder-integrator
    sourceEvidenceIds: []
    extensions: {}
    subjectIds:
      - requirement-transfer
      - kpi-transfer-rate
    preconditions:
      - Agreed load and route inputs are configured in the chosen test environment.
    procedure:
      - Record the agreed observation window.
      - Count confirmed destination handoffs and record interruptions.
      - Compare the measured rate with the declared criterion.
    measurementMethod:
      state: provided
      value: Timestamped handoff count divided by the agreed observation duration.
    criterion:
      state: provided
      value:
        kind: numeric
        operator: gte
        threshold:
          value: "60"
          unit: count/h
          subject: pallet
    evidenceRequirementIds:
      - evidence-rate
    assessorId:
      state: provided
      value: stakeholder-integrator
    approverId:
      state: provided
      value: stakeholder-operator
  - id: test-recovery
    title: Observe occupied-destination recovery
    description: null
    ownerId:
      state: provided
      value: stakeholder-integrator
    sourceEvidenceIds: []
    extensions: {}
    subjectIds:
      - requirement-recovery
    preconditions:
      - The operator has agreed the exception procedure.
    procedure:
      - Present an occupied destination in the chosen test environment.
      - Observe notification and operator-led recovery against the agreed procedure.
    measurementMethod:
      state: provided
      value: Record whether the agreed notification and recovery procedure can be followed.
    criterion:
      state: provided
      value:
        kind: boolean
        expected: true
    evidenceRequirementIds:
      - evidence-recovery
    assessorId:
      state: provided
      value: stakeholder-integrator
    approverId:
      state: provided
      value: stakeholder-operator
